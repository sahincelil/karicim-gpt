<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="KaricimGPT — Türkçe-first AI sohbet ve agent çalışma alanı."><meta name="theme-color" content="#0b0c0e"><link rel="manifest" href="/manifest.webmanifest"><title>KaricimGPT</title>
<style>:root{color-scheme:dark;--bg:#0b0c0e;--panel:#121419;--line:#292d35;--text:#f3f4f6;--muted:#9ca3af;--accent:#d7e4c4;--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171b18 0,#0b0c0e 42%);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;max-width:960px;margin:auto;padding:18px 16px 32px;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 14px}h1{margin:0;font:italic 28px Georgia,serif}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button{border:1px solid var(--line);background:#171a20;color:var(--text);border-radius:10px;padding:8px 11px;cursor:pointer}button:hover{border-color:#4b5563}.ghost{color:var(--muted)}#mode.agent-on{border-color:#7d9b72;color:var(--accent)}.status{min-height:20px;font-size:12px;color:var(--muted);padding:4px 2px}.error{color:var(--danger)}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin-left:5px}.shortcut{font-size:11px;color:var(--muted);margin-top:4px}.search{width:100%;margin:8px 0 10px;border:1px solid var(--line);background:#111318;color:var(--text);border-radius:12px;padding:10px 12px;outline:none}.search:focus{border-color:#4b5563}#chat{flex:1;display:flex;flex-direction:column;gap:14px;padding:8px 0 20px}.msg{max-width:84%;padding:13px 15px;border:1px solid var(--line);border-radius:16px;overflow-wrap:anywhere}.user{align-self:flex-end;background:#1b211b}.assistant{align-self:flex-start;background:var(--panel)}.meta{font-size:11px;color:var(--muted);margin-bottom:5px}.content{white-space:pre-wrap}.council-card{display:grid;gap:8px;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0f1115}.council-card section{display:grid;gap:3px}.council-card strong{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.council-card div{white-space:normal}.content pre{white-space:pre;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#0a0b0d}.actions{display:flex;gap:6px;margin-top:9px;opacity:.75}.actions button{font-size:11px;padding:5px 8px}.empty{margin:auto;text-align:center;color:var(--muted);padding:60px 10px}.empty strong{display:block;color:var(--text);font:italic 34px Georgia,serif}form{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%);padding-top:20px}.composer{display:flex;gap:8px;border:1px solid var(--line);background:#111318;padding:8px;border-radius:16px}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:8px;min-height:42px;max-height:180px}.send{background:#d7e4c4;color:#10140f;font-weight:700}.send:disabled{opacity:.55;cursor:wait}.factory-trigger{border-color:#59644f;color:var(--accent)}#factory-dialog{width:min(94vw,860px);max-width:none;max-height:88vh;overflow:auto;border:1px solid #3b4438;border-radius:18px;background:#111510;color:var(--text);padding:20px;box-shadow:0 24px 90px #000b}#factory-dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}.factory-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.factory-head h2{margin:0;font:italic 24px Georgia,serif}.factory-copy{color:var(--muted);font-size:13px}.factory-field{display:grid;gap:6px;margin:12px 0}.factory-field label{color:#d8dfd2;font-size:13px}.factory-field input,.factory-field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#0b0d0a;color:var(--text);padding:11px;font:inherit}.factory-field textarea{min-height:78px;resize:vertical}.factory-actions{display:flex;gap:8px;flex-wrap:wrap}.factory-run{background:var(--accent);color:#10140f;font-weight:700}.factory-output{white-space:pre-wrap;overflow-wrap:anywhere;max-height:42vh;overflow:auto;border:1px solid var(--line);background:#090b09;border-radius:12px;padding:14px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.factory-output:empty{display:none}#factory-status{min-height:22px;color:var(--muted);font-size:12px;margin:8px 0}@media(max-width:640px){.app{padding:12px 10px 24px}header{align-items:flex-start}.controls{max-width:68%}.msg{max-width:94%}h1{font-size:24px}.factory-head h2{font-size:20px}}</style></head>
<body><div class="app"><header><h1>KaricimGPT</h1><div class="controls"><button id="factory-open" class="factory-trigger" type="button">LEGION Factory</button><button id="mode" class="ghost" type="button" aria-pressed="false">Mod: Normal</button><button id="export" class="ghost" type="button">Dışa aktar</button><button id="clear" class="ghost" type="button">Temizle</button></div></header><div class="status">Motor <span class="badge">AI</span><div class="shortcut">Enter gönder · Shift+Enter yeni satır · Ctrl/Cmd+K odak · Ctrl/Cmd+E dışa aktar</div></div><input id="search" class="search" type="search" placeholder="Sohbette ara…" aria-label="Sohbette ara"><main id="chat"><div class="empty"><strong>KaricimGPT</strong><span>Ücretsiz AI ile sohbet et.</span></div></main><div id="status" class="status" aria-live="polite"></div><form id="form"><div class="composer"><textarea id="input" rows="1" maxlength="12000" placeholder="Mesajını yaz…" autocomplete="off"></textarea><button id="send" class="send" type="submit">Gönder</button></div></form></div>
<dialog id="factory-dialog" aria-labelledby="factory-title"><div class="factory-head"><div><h2 id="factory-title">LEGION CONTENT FACTORY</h2><div class="factory-copy">SYSTEM ARCHIVE · Shorts + uzun video üretim paketi</div></div><button type="button" data-factory-close aria-label="Kapat">Kapat</button></div><form id="factory-form"><div class="factory-field"><label for="factory-topic">Video konusu</label><input id="factory-topic" name="topic" maxlength="500" minlength="4" required placeholder="Örn. Beyin neden kör noktamızı doldurur?"></div><div class="factory-field"><label for="factory-brief">Ek notlar (isteğe bağlı)</label><textarea id="factory-brief" name="brief" maxlength="1800" placeholder="Hedef kitle, kaynak, ton veya özellikle vurgulanacak noktalar…"></textarea></div><div class="factory-actions"><button id="factory-run" class="factory-run" type="submit">İki formatı üret</button><button id="factory-copy" type="button" disabled>Paketi kopyala</button></div></form><div id="factory-status" role="status" aria-live="polite"></div><pre id="factory-output" class="factory-output"></pre></dialog>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});</script><script src="/analytics.js" defer></script><script src="/app.js" defer></script><script src="/content-factory-ui.js" defer></script></body></html>
