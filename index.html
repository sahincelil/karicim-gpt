<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="KaricimGPT — tarayıcıdan xAI Grok ile sohbet arayüzü.">
  <title>KaricimGPT</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0c0e;--panel:#121419;--line:#292d35;--text:#f3f4f6;--muted:#9ca3af;--accent:#d7e4c4;--danger:#ff8b8b}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171b18 0,#0b0c0e 42%);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app{min-height:100vh;max-width:920px;margin:auto;padding:20px 16px 32px;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 18px}h1{margin:0;font:italic 28px Georgia,serif}button{border:1px solid var(--line);background:#171a20;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{border-color:#4b5563}.ghost{color:var(--muted)}
    #chat{flex:1;display:flex;flex-direction:column;gap:14px;padding:8px 0 20px}.msg{max-width:82%;padding:13px 15px;border:1px solid var(--line);border-radius:16px;white-space:pre-wrap}.user{align-self:flex-end;background:#1b211b}.assistant{align-self:flex-start;background:var(--panel)}.meta{font-size:11px;color:var(--muted);margin-bottom:4px}
    .empty{margin:auto;text-align:center;color:var(--muted);padding:60px 10px}.empty strong{display:block;color:var(--text);font:italic 34px Georgia,serif;margin-bottom:8px}
    form{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%);padding-top:20px}.composer{display:flex;gap:8px;border:1px solid var(--line);background:#111318;padding:8px;border-radius:16px}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:8px;min-height:42px;max-height:180px}.send{background:#d7e4c4;color:#10140f;font-weight:700}
    dialog{border:1px solid var(--line);border-radius:16px;background:#121419;color:var(--text);width:min(560px,calc(100% - 32px));padding:20px}dialog::backdrop{background:#000b}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field input,.field select{background:#0b0c0e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{font-size:12px;color:var(--muted)}a{color:var(--accent)}
  </style>
</head>
<body>
<div class="app">
  <header><h1>KaricimGPT</h1><div><button id="settings" class="ghost">Ayarlar</button><button id="clear" class="ghost">Temizle</button></div></header>
  <main id="chat"><div class="empty" id="empty"><strong>KaricimGPT</strong><span>Grok ile sohbet etmek için mesajını yaz.</span></div></main>
  <form id="form"><div class="composer"><textarea id="input" rows="1" placeholder="Mesajını yaz…" autocomplete="off"></textarea><button class="send" type="submit">Gönder</button></div></form>
</div>
<dialog id="dialog"><h2>Ayarlar</h2><p class="hint">API anahtarını GitHub'a kaydetme. Bu statik uygulama anahtarı yalnızca bu tarayıcıda kullanır.</p>
  <label class="field">xAI API anahtarı<input id="key" type="password" autocomplete="off" placeholder="xai-…"></label>
  <label class="field">Model<select id="model"><option value="grok-4.5">grok-4.5</option><option value="grok-4.1-fast">grok-4.1-fast</option></select></label>
  <div class="actions"><button type="button" id="cancel">İptal</button><button type="button" id="save">Kaydet</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s), chat=$('#chat'), input=$('#input'), dialog=$('#dialog'), key=$('#key'), model=$('#model');
const state=JSON.parse(localStorage.getItem('karicimgpt')||'{"messages":[],"model":"grok-4.5"}');
model.value=state.model; key.value=localStorage.getItem('karicimgpt-key')||'';
function render(){chat.innerHTML=''; if(!state.messages.length){chat.innerHTML='<div class="empty"><strong>KaricimGPT</strong><span>Grok ile sohbet etmek için mesajını yaz.</span></div>';return} state.messages.forEach(m=>{const el=document.createElement('div');el.className='msg '+m.role;el.innerHTML='<div class="meta">'+(m.role==='user'?'Sen':'KaricimGPT')+'</div>';el.append(document.createTextNode(m.content));chat.append(el)});chat.scrollTop=chat.scrollHeight}
function saveState(){localStorage.setItem('karicimgpt',JSON.stringify(state))}
async function send(text){const apiKey=localStorage.getItem('karicimgpt-key');if(!apiKey){dialog.showModal();throw new Error('Önce Ayarlar bölümünden xAI API anahtarı ekle.')} state.messages.push({role:'user',content:text});saveState();render();
  const pending={role:'assistant',content:'…'};state.messages.push(pending);render();
  try{const r=await fetch('https://api.x.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:state.model,messages:state.messages.slice(0,-1).map(x=>({role:x.role,content:x.content})),temperature:.7})});if(!r.ok)throw new Error('xAI API '+r.status+': '+await r.text());const data=await r.json();pending.content=data.choices?.[0]?.message?.content||'Yanıt alınamadı.'}catch(e){pending.content='Hata: '+e.message}saveState();render()}
$('#form').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';send(text)});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit()}});
$('#settings').onclick=()=>dialog.showModal();$('#cancel').onclick=()=>dialog.close();$('#save').onclick=()=>{localStorage.setItem('karicimgpt-key',key.value.trim());state.model=model.value;saveState();dialog.close()};$('#clear').onclick=()=>{state.messages=[];saveState();render()};render();
</script>
</body>
</html>
