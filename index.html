<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="KaricimGPT — ücretsiz AI ve güvenli agent modu."><meta name="theme-color" content="#0b0c0e"><title>KaricimGPT</title>
<style>:root{color-scheme:dark;--bg:#0b0c0e;--panel:#121419;--line:#292d35;--text:#f3f4f6;--muted:#9ca3af;--accent:#d7e4c4;--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171b18 0,#0b0c0e 42%);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;max-width:920px;margin:auto;padding:20px 16px 32px;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 18px}h1{margin:0;font:italic 28px Georgia,serif}.controls{display:flex;gap:7px;align-items:center}button{border:1px solid var(--line);background:#171a20;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{border-color:#4b5563}.ghost{color:var(--muted)}#chat{flex:1;display:flex;flex-direction:column;gap:14px;padding:8px 0 20px}.msg{max-width:82%;padding:13px 15px;border:1px solid var(--line);border-radius:16px;white-space:pre-wrap}.user{align-self:flex-end;background:#1b211b}.assistant{align-self:flex-start;background:var(--panel)}.meta{font-size:11px;color:var(--muted);margin-bottom:4px}.empty{margin:auto;text-align:center;color:var(--muted);padding:60px 10px}.empty strong{display:block;color:var(--text);font:italic 34px Georgia,serif}form{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%);padding-top:20px}.composer{display:flex;gap:8px;border:1px solid var(--line);background:#111318;padding:8px;border-radius:16px}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:8px;min-height:42px;max-height:180px}.send{background:#d7e4c4;color:#10140f;font-weight:700}.send:disabled{opacity:.55;cursor:wait}.status{min-height:20px;font-size:12px;color:var(--muted);padding:4px 2px}.error{color:var(--danger)}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin-left:5px}.agent-on{border-color:#7d9b72;color:var(--accent)}</style>
</head>
<body><div class="app"><header><h1>KaricimGPT</h1><div class="controls"><button id="mode" class="ghost" type="button" aria-pressed="false">Agent: Kapalı</button><button id="clear" class="ghost" type="button">Temizle</button></div></header><div class="status">Motor <span class="badge">OpenRouter free</span></div><main id="chat"><div class="empty"><strong>KaricimGPT</strong><span>Ücretsiz AI ile sohbet et.</span></div></main><div id="status" class="status" aria-live="polite"></div><form id="form"><div class="composer"><textarea id="input" rows="1" maxlength="12000" placeholder="Mesajını yaz…" autocomplete="off"></textarea><button id="send" class="send" type="submit">Gönder</button></div></form></div><script src="/app.js" defer></script></body></html>
