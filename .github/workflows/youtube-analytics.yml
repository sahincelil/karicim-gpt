name: SYSTEM ARCHIVE YouTube analytics tests

on:
  pull_request:
    paths:
      - "scripts/youtube_analytics.py"
      - "tests/test_youtube_analytics.py"
      - "requirements-youtube-analytics.txt"
      - ".github/workflows/youtube-analytics.yml"
  push:
    branches:
      - github-control-plane
      - system-archive-foundation
    paths:
      - "scripts/youtube_analytics.py"
      - "tests/test_youtube_analytics.py"
      - "requirements-youtube-analytics.txt"
      - ".github/workflows/youtube-analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-archive-youtube-analytics-tests-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline analytics logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic-data tests
        run: python -m unittest discover -s tests -p "test_youtube_analytics.py" -v
