name: nabiz
run-name: nabiz / ${{ github.event_name }}

permissions: {}

concurrency:
  group: nabiz-${{ github.event_name }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 4-20 * * *"
  workflow_dispatch:
    inputs:
      konu:
        description: Konu (runner grok değil)
        required: false
        default: Turkiye guncel
  repository_dispatch:
    types: [karicim-nabiz]

jobs:
  note:
    uses: ./.github/workflows/reusable-verify.yml
    with:
      task: nabiz
      konu: ${{ inputs.konu || github.event.client_payload.konu || 'Turkiye guncel' }}
