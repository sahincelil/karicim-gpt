name: reusable-verify

on:
  workflow_call:
    inputs:
      task:
        description: tree | skills | nabiz
        required: true
        type: string
      min:
        description: En az SKILL.md (task=skills)
        required: false
        type: string
        default: "1"
      konu:
        description: Nabız konusu (task=nabiz)
        required: false
        type: string
        default: Turkiye guncel

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resources
        run: |
          set -euo pipefail
          echo "label=ubuntu-24.04 (public: 4 vCPU / 16GB / 14GB)"
          echo "nproc=$(nproc)"
          free -h
          df -h /

      - name: Build verify image
        run: |
          set -euo pipefail
          docker build -t karicim-verify:local .github/containers/verify

      - name: Run in container
        env:
          TASK: ${{ inputs.task }}
          MIN: ${{ inputs.min }}
          KONU: ${{ inputs.konu }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src:ro" \
            -w /src \
            -e TASK -e MIN -e KONU -e EVENT -e SHA \
            --network none \
            --read-only \
            --tmpfs /tmp \
            karicim-verify:local
