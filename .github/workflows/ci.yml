name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tree:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: list
        run: |
          echo "sha ${GITHUB_SHA}"
          find . -type f -not -path './.git/*' | sort
