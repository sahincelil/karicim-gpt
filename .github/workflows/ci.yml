name: ci
run-name: ci / ${{ github.event_name }} / ${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      verbose:
        description: Ağaç (reusable tree her zaman listeler)
        type: boolean
        default: true

jobs:
  tree:
    uses: ./.github/workflows/reusable-verify.yml
    with:
      task: tree
