name: app-check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show runtime
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for file in app.js api/chat.js api/agent.js api/health.js lib/security.js lib/github.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check module imports
        run: |
          set -euo pipefail
          node -e "Promise.all(['./api/chat.js','./api/agent.js','./api/health.js','./lib/security.js','./lib/github.js'].map((p) => import(p))).then(() => console.log('module imports: ok'))"

      - name: Check configuration
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('json config: ok')"

      - name: Check required files and secret boundaries
        run: |
          set -euo pipefail
          required=(index.html app.js api/chat.js api/agent.js api/health.js lib/security.js lib/github.js vercel.json package.json)
          for file in "${required[@]}"; do
            test -s "$file"
          done
          ! grep -Fq 'api.x.ai' index.html
          ! grep -Fq 'OPENROUTER_API_KEY' index.html
          ! grep -Fq 'XAI_API_KEY' index.html

      - name: Check agent guardrails
        run: |
          set -euo pipefail
          checks=(
            "type: 'openrouter:web_search'|api/agent.js"
            "type: 'openrouter:web_fetch'|api/agent.js"
            "max_total_results|api/agent.js"
            "parallel_tool_calls: false|api/agent.js"
            "DEFAULT_MODEL = 'openrouter/free'|api/agent.js"
            "configuredModel === DEFAULT_MODEL|api/agent.js"
            "MAX_TOOL_CALLS_TOTAL = 6|api/agent.js"
            "MAX_TOOL_ROUNDS = 4|api/agent.js"
            "MAX_CUSTOM_TOOL_RESULT = 30000|api/agent.js"
            "tool_call_id: call.id|api/agent.js"
            "readPublicGitHubFile|api/agent.js"
            "rateLimit|api/agent.js"
            "MAX_BUCKETS|lib/security.js"
          )
          for item in "${checks[@]}"; do
            pattern="${item%%|*}"
            file="${item##*|}"
            echo "Checking $file for: $pattern"
            grep -Fq "$pattern" "$file"
          done

      - name: Check chat and GitHub boundaries
        run: |
          set -euo pipefail
          grep -Fq "type: 'openrouter:web_search'" api/chat.js
          grep -Fq "type: 'openrouter:web_fetch'" api/chat.js
          grep -Fq 'models' api/chat.js
          grep -Fq "DEFAULT_FREE_MODEL = 'openrouter/free'" api/chat.js
          grep -Fq 'MAX_FILE_BYTES = 120000' lib/github.js
          grep -Fq 'Yalnızca tekil public dosyalar okunabilir' lib/github.js
          grep -Fq "path.startsWith('/')" lib/github.js
