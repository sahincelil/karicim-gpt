name: app-check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check required files and secret boundaries
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f api/chat.js
          test -f api/agent.js
          test -f lib/security.js
          test -f vercel.json
          ! grep -q 'api.x.ai' index.html
          ! grep -q 'OPENROUTER_API_KEY' index.html
          ! grep -q 'XAI_API_KEY' index.html
      - name: Check agent guardrails
        run: |
          set -euo pipefail
          grep -q 'openrouter:web_search' api/agent.js
          grep -q 'openrouter:web_fetch' api/agent.js
          grep -q 'max_total_results' api/agent.js
          grep -q 'parallel_tool_calls: false' api/agent.js
          grep -q 'rateLimit' api/agent.js
