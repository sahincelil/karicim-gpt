name: app-check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check app.js
          node --check api/chat.js
          node --check api/agent.js
          node --check lib/security.js
      - name: Check required files and secret boundaries
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f api/chat.js
          test -f api/agent.js
          test -f lib/security.js
          test -f vercel.json
          ! grep -q 'api.x.ai' index.html
          ! grep -q 'OPENROUTER_API_KEY' index.html
          ! grep -q 'XAI_API_KEY' index.html
      - name: Check agent guardrails
        run: |
          set -euo pipefail
          grep -q "type: 'openrouter:web_search'" api/agent.js
          grep -q "type: 'openrouter:web_fetch'" api/agent.js
          grep -q 'max_total_results' api/agent.js
          grep -q 'parallel_tool_calls: false' api/agent.js
          grep -q "DEFAULT_MODEL = 'openrouter/free'" api/agent.js
          grep -q 'configuredModel === DEFAULT_MODEL' api/agent.js
          grep -q 'MAX_TOOL_CALLS_TOTAL = 6' api/agent.js
          grep -q 'const remaining = MAX_TOOL_CALLS_TOTAL - totalToolCalls' api/agent.js
          grep -q 'Math.min(2, remaining)' api/agent.js
          grep -q 'rateLimit' api/agent.js
          grep -q 'MAX_BUCKETS' lib/security.js
      - name: Check chat web tools
        run: |
          set -euo pipefail
          grep -q "type: 'openrouter:web_search'" api/chat.js
          grep -q "type: 'openrouter:web_fetch'" api/chat.js
          grep -q 'models' api/chat.js
          grep -q "DEFAULT_FREE_MODEL = 'openrouter/free'" api/chat.js
