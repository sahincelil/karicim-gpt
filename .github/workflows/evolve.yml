name: Evolve

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: evolve
  cancel-in-progress: true

jobs:
  evolve-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run regression checks
        id: test
        run: npm test

      - name: Start runtime
        if: success()
        env:
          PORT: 3000
          NODE_ENV: test
        run: |
          node server.js > /tmp/karicimgpt-evolve.log 2>&1 &
          echo $! > /tmp/karicimgpt-evolve.pid

      - name: Verify evolve endpoint
        if: success()
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/evolve > /tmp/evolve.json; then
              cat /tmp/evolve.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/karicimgpt-evolve.log
          exit 1

      - name: Stop runtime
        if: always()
        run: |
          if test -f /tmp/karicimgpt-evolve.pid; then
            kill "$(cat /tmp/karicimgpt-evolve.pid)" || true
          fi

      - name: Open maintenance issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Evolve audit failed';
            const body = [
              'Automated evolve audit detected a regression.',
              '',
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'No source code was modified automatically.'
            ].join('\\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'evolve-failure',
              per_page: 10
            });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['evolve-failure']
              });
            }
