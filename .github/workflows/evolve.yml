name: Evolve

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: evolve
  cancel-in-progress: true

jobs:
  evolve-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run regression checks
        id: test
        run: npm test

      - name: Start runtime
        if: success()
        env:
          PORT: 3000
          NODE_ENV: test
          BRIDGE_REQUIRED: true
          MEMORY_ADMIN_REQUIRED: true
          PERSISTENT_MEMORY_REQUIRED: true
          DATA_DIR: /tmp/karicimgpt-evolve-data
          BODY_ADMIN_TOKEN: evolve-admin-token
          BRIDGE_SHARED_SECRET: evolve-bridge-secret
        run: |
          node server.js > /tmp/karicimgpt-evolve.log 2>&1 &
          echo $! > /tmp/karicimgpt-evolve.pid

      - name: Wait for runtime
        if: success()
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health > /tmp/evolve-health.json; then
              cat /tmp/evolve-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/karicimgpt-evolve.log
          exit 1

      - name: Generate audit report
        if: success()
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/audit | tee /tmp/audit.json
          node -e "const x=require('fs').readFileSync('/tmp/audit.json','utf8'); const j=JSON.parse(x); if(!j.ok) process.exit(1); console.log('Audit status:',j.status,'fingerprint:',j.fingerprint)"

      - name: Generate improvement proposals
        if: success()
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/proposals | tee /tmp/proposals.json
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/proposals.json','utf8')); if(!j.ok || !Array.isArray(j.proposals)) process.exit(1); console.log('Proposals:',j.proposals.length)"

      - name: Verify evolve endpoint
        if: success()
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/evolve > /tmp/evolve.json; then
              cat /tmp/evolve.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/karicimgpt-evolve.log
          exit 1

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evolve-audit-report
          path: |
            /tmp/audit.json
            /tmp/proposals.json
          if-no-files-found: ignore

      - name: Stop runtime
        if: always()
        run: |
          if test -f /tmp/karicimgpt-evolve.pid; then
            kill "$(cat /tmp/karicimgpt-evolve.pid)" || true
          fi

      - name: Open maintenance issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Evolve audit failed';
            const body = [
              'Automated evolve audit detected a regression.',
              '',
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'No source code was modified automatically.'
            ].join('\\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 10
            });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
