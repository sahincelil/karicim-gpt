name: Autonomous Maintenance

on:
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-maintenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --ignore-scripts
      - name: Regression suite
        run: npm test
      - name: Autonomous benchmark
        run: npm run benchmark
      - name: Start runtime
        run: node server.js > /tmp/karicimgpt.log 2>&1 & echo $! > /tmp/karicimgpt.pid
      - name: Health and autonomy checks
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/health.json; then
              cat /tmp/health.json
              curl --fail --silent http://127.0.0.1:3000/api/autonomy
              exit 0
            fi
            sleep 1
          done
          cat /tmp/karicimgpt.log
          exit 1
      - name: Stop runtime
        if: always()
        run: |
          if test -f /tmp/karicimgpt.pid; then kill "$(cat /tmp/karicimgpt.pid)" || true; fi
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-maintenance-log
          path: /tmp/karicimgpt.log
          if-no-files-found: ignore
