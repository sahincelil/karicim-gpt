name: Autonomous Maintenance

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-maintenance
  cancel-in-progress: true

jobs:
  health-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Toolchain preflight
        run: |
          node --version
          npm --version
          test "$(node -p "process.versions.node.split('.')[0]")" -ge 24
          if test -f package-lock.json || test -f npm-shrinkwrap.json || test -f yarn.lock; then echo "Lockfile detected"; else echo "No lockfile: npm install is intentionally used without cache"; fi

      - name: Install dependencies
        run: npm ci

      - name: Static checks and regression tests
        run: npm test

      - name: Verify required runtime files
        run: |
          test -f server.js
          test -f api/chat.js
          test -f api/agent.js
          test -f api/memory.js
          test -f lib/security.js
          test -f lib/memory.js
          test -f lib/heartbeat.js
          test -f lib/health.js
          test -f api/bridge.js
          test -f api/evolve.js
          test -f test/integration.test.js

      - name: Start runtime
        env:
          PORT: 3000
          NODE_ENV: test
          BRIDGE_REQUIRED: true
          MEMORY_ADMIN_REQUIRED: true
          PERSISTENT_MEMORY_REQUIRED: true
          DATA_DIR: /tmp/karicimgpt-data
          BODY_ADMIN_TOKEN: integration-admin-token
          BRIDGE_SHARED_SECRET: integration-test-secret
        run: |
          node server.js > /tmp/karicimgpt.log 2>&1 &
          echo $! > /tmp/karicimgpt.pid

      - name: Runtime health check
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/karicimgpt.log
          exit 1

      - name: Generate audit and improvement report
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/audit > /tmp/audit.json
          curl --fail --silent --show-error http://127.0.0.1:3000/api/proposals > /tmp/proposals.json
          node -e "for (const f of ['/tmp/audit.json','/tmp/proposals.json']) { const j=JSON.parse(require('fs').readFileSync(f,'utf8')); if(!j.ok) process.exit(1); } console.log(require('fs').readFileSync('/tmp/audit.json','utf8')); console.log(require('fs').readFileSync('/tmp/proposals.json','utf8'));"

      - name: Integration tests
        env:
          PORT: 3000
          BRIDGE_SHARED_SECRET: integration-test-secret
        run: node test/integration.test.js

      - name: Stop runtime
        if: always()
        run: |
          if test -f /tmp/karicimgpt.pid; then
            kill "$(cat /tmp/karicimgpt.pid)" || true
          fi

      - name: Upload maintenance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-maintenance-reports
          path: |
            /tmp/audit.json
            /tmp/proposals.json
          if-no-files-found: ignore

      - name: Upload runtime log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-maintenance-log
          path: /tmp/karicimgpt.log
          if-no-files-found: ignore
