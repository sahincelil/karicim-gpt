name: LEGION Agent Bridge Contract

on:
  pull_request:
    paths:
      - "schemas/agent-task.schema.json"
      - "tests/fixtures/agent-task.valid.json"
      - "scripts/validate_agent_task.py"
      - "requirements-agent-bridge.txt"
      - "api/claude.js"
      - "api/gemini.js"
      - "lib/provider-auth.js"
      - "docs/AGENT_BRIDGE.md"
      - ".env.example"
      - "package.json"
      - "server.js"
      - "lib/council.js"
      - "test/**"
      - ".github/workflows/agent-bridge-contract.yml"
  push:
    branches: ["main"]
    paths:
      - "schemas/agent-task.schema.json"
      - "tests/fixtures/agent-task.valid.json"
      - "scripts/validate_agent_task.py"
      - "requirements-agent-bridge.txt"
      - "api/claude.js"
      - "api/gemini.js"
      - "lib/provider-auth.js"
      - "docs/AGENT_BRIDGE.md"
      - ".env.example"
      - "package.json"
      - "server.js"
      - "lib/council.js"
      - "test/**"
      - ".github/workflows/agent-bridge-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legion-agent-bridge-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    name: Validate task envelope and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run runtime syntax and regression checks
        run: npm run check
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check -r requirements-agent-bridge.txt
      - name: Validate schema and fixture
        run: python scripts/validate_agent_task.py
