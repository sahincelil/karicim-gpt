name: skills

permissions: {}

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/skills/**"
      - ".github/workflows/skills.yml"
      - "skills/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/skills/**"
      - "skills/**"
  workflow_dispatch:
    inputs:
      min:
        description: En az kaç SKILL.md
        type: string
        default: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SKILL.md frontmatter
        shell: bash
        env:
          MIN: ${{ github.event.inputs.min || '1' }}
        run: |
          set -euo pipefail
          n=0
          shopt -s nullglob
          for f in .github/skills/*/SKILL.md; do
            test -f "$f"
            grep -q '^name:' "$f"
            grep -q '^description:' "$f"
            echo "ok $f"
            n=$((n+1))
          done
          test "$n" -ge "$MIN"
          echo "skills $n (min $MIN)"
