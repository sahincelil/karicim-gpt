name: skills
run-name: skills / ${{ github.event_name }}

permissions: {}

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/skills/**"
      - ".github/workflows/skills.yml"
      - ".github/workflows/reusable-verify.yml"
      - "skills/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/skills/**"
      - "skills/**"
  workflow_dispatch:
    inputs:
      min:
        description: En az kaç SKILL.md
        type: string
        default: "1"

jobs:
  validate:
    uses: ./.github/workflows/reusable-verify.yml
    with:
      task: skills
      min: ${{ inputs.min || '1' }}
